<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Find Investors – IdeaNest</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .investors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .pitch-modal-body { padding: 24px 28px; }
    .pitch-modal-body .form-group { margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">🪺 IdeaNest</div>
    <nav class="sidebar-nav">
      <div class="nav-section">Discover</div>
      <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
      <a href="explore.html"><i class="fas fa-compass"></i> Explore Ideas</a>
      <a href="investors.html" class="active"><i class="fas fa-hand-holding-usd"></i> Find Investors</a>
      <div class="nav-section">My Work</div>
      <a href="submit-idea.html"><i class="fas fa-plus-circle"></i> Submit Idea</a>
      <a href="my-ideas.html"><i class="fas fa-lightbulb"></i> My Ideas</a>
      <a href="collaborations.html"><i class="fas fa-users"></i> Collaborations</a>
      <div class="nav-section">Account</div>
      <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
      <a href="../index.html" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebarAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="sidebarName">Guest</div>
          <div class="user-role" id="sidebarRole">Innovator</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="app-topbar">
      <div>
        <div class="app-topbar-title">Find Investors</div>
        <div style="color:var(--clr-muted);font-size:0.88rem;margin-top:2px">Connect with active investors looking for the next big idea</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:28px">
      <div class="stat-card">
        <div class="stat-card-icon icon-gold">💰</div>
        <div class="stat-card-info"><div class="stat-card-num">380+</div><div class="stat-card-label">Active Investors</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon icon-green">🤝</div>
        <div class="stat-card-info"><div class="stat-card-num">₹240Cr+</div><div class="stat-card-label">Total Funded</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon icon-teal">📈</div>
        <div class="stat-card-info"><div class="stat-card-num">82</div><div class="stat-card-label">Deals Closed</div></div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar" style="margin-bottom:24px">
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="investorSearch" placeholder="Search investors..." oninput="filterInvestors()"/>
      </div>
      <button class="filter-pill active" onclick="setInvFilter('all',this)">All</button>
      <button class="filter-pill" onclick="setInvFilter('edtech',this)">🎓 EdTech</button>
      <button class="filter-pill" onclick="setInvFilter('health',this)">🏥 Health</button>
      <button class="filter-pill" onclick="setInvFilter('fintech',this)">💳 Fintech</button>
      <button class="filter-pill" onclick="setInvFilter('startup',this)">🌱 Startup</button>
    </div>

    <div class="investors-grid" id="investorsGrid"></div>
  </main>
</div>

<!-- Pitch Modal -->
<div class="modal-overlay" id="pitchModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Send a Pitch</h2>
      <button class="modal-close" onclick="closePitchModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="pitch-modal-body">
      <div id="pitchTarget" style="display:flex;align-items:center;gap:14px;margin-bottom:24px;padding:16px;background:rgba(255,255,255,0.03);border-radius:var(--radius-sm)"></div>
      <div class="form-group">
        <label class="form-label">Select Your Idea</label>
        <select id="pitchIdeaSelect" class="form-select">
          <option value="">Choose an idea to pitch...</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Personalized Message</label>
        <textarea id="pitchMessage" class="form-textarea" rows="5" placeholder="Introduce yourself and your idea. Be specific about why this investor is the right fit..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Pitch Deck URL (optional)</label>
        <input type="url" id="pitchDeckUrl" class="form-input" placeholder="https://drive.google.com/..."/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closePitchModal()">Cancel</button>
      <button class="btn btn-gold" onclick="sendPitch()"><i class="fas fa-paper-plane"></i> Send Pitch</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/investors.js"></script>
</body>
</html>
